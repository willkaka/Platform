plugins {
    id 'org.springframework.boot' version '2.7.18' // 升级到 2.x 最新稳定版，兼容 Java 8
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
}

group = 'com.hyw'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = 'VERSION_1_8'
    targetCompatibility = 'VERSION_1_8'
}

// 配置仓库，移除不安全的 http 和本地绝对路径
repositories {
    // 阿里云镜像 (使用 https)
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    // 本地 libs 目录 (相对路径，可移植)
    flatDir { dirs 'D:\\ideaSpace\\jars' }
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    // 排除潜在的日志冲突
    all {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'log4j', module: 'log4j'
    }
}

dependencies {
    // --- Spring Boot Starters ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // 测试依赖 (包含 JUnit 5, Mockito 等)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'junit:junit:4.13.1'

    // --- 数据库 ---
    runtimeOnly 'mysql:mysql-connector-java:8.0.33'
    implementation 'org.xerial:sqlite-jdbc:3.42.0.0' // 升级 SQLite
    implementation 'com.baomidou:mybatis-plus-boot-starter:3.5.5' // 版本与 Spring Boot 2.7 对齐

    // --- 工具库 (版本由 Spring Boot 管理，无需指定) ---
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.apache.commons:commons-lang3:3.12.0' // 显式指定版本
    implementation 'commons-fileupload:commons-fileupload:1.5' // ✅ 必须指定版本
    implementation 'org.apache.httpcomponents:httpclient:4.5.14' // 显式指定版本
    implementation 'org.quartz-scheduler:quartz:2.3.2' // 显式指定版本
    implementation 'org.aspectj:aspectjweaver:1.9.7' // 显式指定版本
    implementation 'org.aspectj:aspectjrt:1.9.7' // 显式指定版本

    // --- 文件与多媒体处理 ---
    implementation 'org.apache.tika:tika-core:2.9.1' // 升级
    implementation 'net.coobird:thumbnailator:0.4.20' // 升级
    implementation 'com.drewnoakes:metadata-extractor:2.19.0' // 升级

    // --- JSON 处理 (建议替换 Fastjson) ---
    // implementation 'com.alibaba.fastjson2:fastjson2:2.0.43' // 推荐 Fastjson2
    implementation 'com.alibaba:fastjson:1.2.83' // 如果必须用 1.x，请用最新安全版
    implementation 'org.json:json:20231013' // 升级

    // --- Excel 处理 (版本对齐) ---
    implementation 'cn.afterturn:easypoi-spring-boot-starter:4.4.0'
    // EasyPOI 4.4 需要 POI 4.x 或 5.x，原 3.15 过低会导致报错
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'com.monitorjbl:xlsx-streamer:2.2.0' // 升级
    implementation 'xerces:xercesImpl:2.12.2' // 升级

    // --- 其他 ---
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.7.0.202309050840-r' // 升级
    implementation 'com.alibaba:QLExpress:3.3.1' // 升级
    implementation 'com.github.javaparser:javaparser-core:3.25.5' // 升级
    implementation 'org.freemarker:freemarker:2.3.32' // 升级

    // --- 本地私有 Jar ---
    // 确保 D:\ideaSpace\jars 中的 jar 包已复制到项目根目录的 libs 文件夹下
    implementation 'com.hyw:gdata:1.0.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
